name: GHAW - Demo Agent

on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC daily
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_activity: ${{ steps.fetch.outputs.has_activity }}
      prompt:       ${{ steps.build.outputs.prompt }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Fetch today's closed issues
        id: fetch
        run: |
          TODAY=$(date -u +"%Y-%m-%dT00:00:00Z")
          CLOSED=$(gh issue list \
            --repo ${{ github.repository }} \
            --state closed \
            --search "closed:>$TODAY" \
            --json number,title,labels,closedAt)

          COUNT=$(echo "$CLOSED" | jq length)
          if [ "$COUNT" = "0" ]; then
            echo "has_activity=false" >> $GITHUB_OUTPUT
            echo "No sprint activity today." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_activity=true" >> $GITHUB_OUTPUT
          fi
          {
            echo 'CLOSED<<EOF'
            echo "$CLOSED"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Run E2E tests (optional)
        if: steps.fetch.outputs.has_activity == 'true'
        run: |
          E2E_CMD=$(yq '.e2e_command' .github/config/config.yml)
          if [ -n "$E2E_CMD" ] && [ "$E2E_CMD" != "null" ]; then
            $E2E_CMD > e2e_results.txt 2>&1 || true
          else
            echo "(no e2e_command configured — Demo Agent will reason about feature state)" > e2e_results.txt
          fi

      - name: Build prompt
        id: build
        if: steps.fetch.outputs.has_activity == 'true'
        run: |
          SHA=$(git rev-parse HEAD)
          E2E=$(cat e2e_results.txt 2>/dev/null || echo "")
          PROMPT="Sprint closed issues: $CLOSED
          Main branch SHA: $SHA
          E2E results: $E2E"
          echo "prompt=$(echo "$PROMPT" | jq -Rs .)" >> $GITHUB_OUTPUT

  run-demo:
    needs: prepare
    if: needs.prepare.outputs.has_activity == 'true'
    uses: ./.github/workflows/core-opencode-run.yml
    with:
      run-name: demo-agent
      command:  ghaw-demo
      prompt:   ${{ needs.prepare.outputs.prompt }}
      agent:    demo
      model:    opencode/big-pickle
      timeout-minutes: 60
    permissions:
      issues:   write
      contents: read
    secrets: inherit

  upload-artifacts:
    needs: [prepare, run-demo]
    if: needs.prepare.outputs.has_activity == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: e2e_results.txt
          if-no-files-found: ignore

      - name: Summary
        run: |
          TODAY=$(date -u +"%Y-%m-%dT00:00:00Z")
          NEW_ISSUES=$(gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --search "created:>$TODAY" \
            --json number | jq length)
          echo "✅ Demo done. New issues opened today: $NEW_ISSUES" >> $GITHUB_STEP_SUMMARY

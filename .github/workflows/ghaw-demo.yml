name: GHAW - Demo Agent

on:
  schedule:
    - cron: '0 5,11,17,23 * * *'   # Every 6h at :05 (5h after grooming)
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_activity: ${{ steps.fetch.outputs.has_activity }}
      prompt:       ${{ steps.build.outputs.prompt }}
      model:        ${{ steps.config.outputs.model }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Read config
        id: config
        run: echo "model=$(yq '.model' .github/config/config.yml)" >> $GITHUB_OUTPUT

      - name: Fetch today's closed issues
        id: fetch
        run: |
          TODAY=$(date -u +"%Y-%m-%dT00:00:00Z")
          CLOSED=$(gh issue list \
            --repo ${{ github.repository }} \
            --state closed \
            --search "closed:>$TODAY" \
            --json number,title,labels,closedAt)

          COUNT=$(echo "$CLOSED" | jq length)
          if [ "$COUNT" = "0" ]; then
            echo "has_activity=false" >> $GITHUB_OUTPUT
            echo "No sprint activity today." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_activity=true" >> $GITHUB_OUTPUT
          fi
          {
            echo 'CLOSED<<EOF'
            echo "$CLOSED"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Build prompt
        id: build
        if: steps.fetch.outputs.has_activity == 'true'
        run: |
          SHA=$(git rev-parse HEAD)
          PROMPT="Sprint closed issues: $CLOSED
          Main branch SHA: $SHA"
          echo "prompt=$(echo "$PROMPT" | jq -Rs .)" >> $GITHUB_OUTPUT

  run:
    needs: prepare
    if: needs.prepare.outputs.has_activity == 'true'
    uses: ./.github/workflows/core-opencode-run.yml
    with:
      run-name: demo-agent
      command:  ghaw-demo
      prompt:   ${{ needs.prepare.outputs.prompt }}
      agent:    demo
      model:    ${{ needs.prepare.outputs.model }}
      timeout-minutes: 60
    permissions:
      issues:   write
      contents: read
    secrets: inherit

  verify:
    needs: [prepare, run]
    if: needs.prepare.outputs.has_activity == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Summary
        run: |
          TODAY=$(date -u +"%Y-%m-%dT00:00:00Z")
          NEW_ISSUES=$(gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --search "created:>$TODAY" \
            --json number | jq length)
          echo "✅ Demo done. New issues opened today: $NEW_ISSUES" >> $GITHUB_STEP_SUMMARY
